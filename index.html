<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Plan smarter. Work better. Get things done.</title>
    <!-- Fonts & Icons CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">
                        <i data-lucide="check-square"></i>
                    </div>
                    <span class="brand-name">TaskFlow</span>
                </div>
                <button id="sidebarToggleBtn" class="icon-btn sidebar-toggle" aria-label="Toggle Sidebar">
                    <i data-lucide="panel-left-close"></i>
                </button>
            </div>
<nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-view="dashboard">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#tasks" class="nav-item" data-view="tasks">
                    <i data-lucide="check-square"></i>
                    <span>My Tasks</span>
                </a>
                <a href="#projects" class="nav-item" data-view="projects">
                    <i data-lucide="folder-kanban"></i>
                    <span>Projects</span>
                </a>
                <a href="#calendar" class="nav-item" data-view="calendar">
                    <i data-lucide="calendar"></i>
                    <span>Calendar</span>
                </a>
                <a href="#team" class="nav-item" data-view="team">
                    <i data-lucide="users"></i>
                    <span>Team</span>
                </a>
                <a href="#analytics" class="nav-item" data-view="analytics">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </a>
                <a href="#notifications" class="nav-item" data-view="notifications">
                    <i data-lucide="bell"></i>
                    <span>Notifications</span>
                    <span class="badge notification-badge-count hidden">0</span>
                </a>
                <a href="#settings" class="nav-item" data-view="settings">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#profile" class="user-card-link" data-view="profile">
                    <div class="user-avatar" id="sidebarAvatar">N</div>
                    <div class="user-info">
                        <span class="user-name" id="sidebarUserName">Nawrin</span>
                        <span class="user-role" id="sidebarUserRole">Senior Lead</span>
                    </div>
                </a>
            </div>
        </aside>
